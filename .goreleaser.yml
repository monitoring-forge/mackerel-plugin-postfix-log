builds:
  - binary: mackerel-plugin-postfix-log
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
archives:
  - format: zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
release:
  github:
    owner: monitoring-forge
    name: mackerel-plugin-postfix-log
